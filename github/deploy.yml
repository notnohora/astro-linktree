name: deplot to GH Pages

on:
  push:
    branches: [main]

    permissions:
      contents: read
      pages: write
      id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v5
    - name: install, build and deploy our site
      uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-lastest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHUb pages
      id: deployment
      uses: actions/deploy-pages@v4


